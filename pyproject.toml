[project]
name = "aide-curator"
version = "0.1.0"
description = "Agentic Intelligent Data Engine for scientific dataset curation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Shufang Xie" },
    { name = "Zequn Liu" },
    { name = "Pan Deng" },
    { name = "Renqian Luo" },
    { name = "Yingce Xia" },
    { name = "Tao Qin" },
    { name = "Rui Yan" },
]
keywords = ["data-curation", "ai-for-science", "huggingface", "rag", "instruction-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "backoff>=2.2.1",
    "datasets==5.0.0",
    "datasketch>=1.6.5",
    "httpx[socks]>=0.23.0",
    "huggingface-hub>=0.26.2",
    "jsonargparse[signatures]>=4.38.0",
    "loguru>=0.7.2",
    "numpy>=1.26.0",
    "openai>=1.55.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
aide-curate = "aide.cli:main"
aide-demo = "aide.demo:main"
aide-dedup = "aide.dedup:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aide"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/.github",
    "/.pre-commit-config.yaml",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/assets",
    "/configs",
    "/docs",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated.*:DeprecationWarning:backoff\\._decorator",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated.*:DeprecationWarning:backoff\\._async",
]
