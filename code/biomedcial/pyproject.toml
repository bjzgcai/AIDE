[project]
name = "AIDE"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "backoff>=2.2.1",
    "bm25s[full]>=0.2.12",
    "chromadb>=1.0.8",
    "cython==3.0.11",
    "datasets==3.6.0",
    "editables>=0.5",
    "hatchling>=1.27.0",
    "huggingface-hub>=0.26.2",
    "jax[cpu]>=0.6.0",
    "jsonargparse>=4.38.0",
    "loguru>=0.7.2",
    "openai>=1.55.0",
    "pybind11>=3.0.0",
    "pystemmer>=3.0.0",
    "python-dotenv>=1.1.0",
    "setuptools>=80.9.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
