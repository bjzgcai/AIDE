name: Bug report
description: Report a reproducible issue in the AIDE release
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      options:
        - Data Collection
        - Data Selection
        - Data Organization
        - CLI / packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the command you ran.
      render: bash
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste non-secret config fields only.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste a short excerpt. Remove API keys, tokens, and private data.
      render: text
