name: Question
description: Ask about usage, configuration, or expected behavior
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the command, config fields, or output path if relevant.
      render: text
